            /* ---------- creatures you can grab and throw ---------- */

            const YELPS = [
                "Аа!",
                "Хөөе!",
                "Тавь!",
                "Бүү!",
                "Ааа-а!",
                "Болиоч!",
            ];
            const layer = $("#toys");
            const rsvpCard = $("#rsvp");
            const kinds =
                innerWidth < 800
                    ? ["ghost", "pumpkin", "bat", "cat", "beer"]
                    : [
                          "ghost",
                          "ghost",
                          "pumpkin",
                          "bat",
                          "cat",
                          "popcorn",
                          "beer",
                      ];

            const toys = kinds.map((kind) => {
                const el = document.createElement("div");
                el.className = `toy toy-${kind}`;
                el.innerHTML = SVG[kind] + '<span class="yelp"></span>';
                layer.append(el);
                const w = el.offsetWidth,
                    h = el.offsetHeight;
                const toy = {
                    el,
                    kind,
                    w,
                    h,
                    heavy: kind === "pumpkin",
                    x: rand(0, innerWidth - w),
                    y: rand(0, innerHeight - h),
                    vx: reducedMotion ? 0 : rand(-50, 50),
                    vy: reducedMotion ? 0 : rand(-50, 50),
                    rot: 0,
                    held: false,
                };

                el.addEventListener("pointerdown", (e) => {
                    e.preventDefault();
                    el.setPointerCapture(e.pointerId);
                    toy.held = true;
                    leaveSlot(toy);
                    toy.grabX = e.clientX - toy.x;
                    toy.grabY = e.clientY - toy.y;
                    toy.lastX = e.clientX;
                    toy.lastY = e.clientY;
                    toy.lastT = performance.now();
                    toy.vx = toy.vy = 0;
                    el.classList.add("held");
                    const yelp = el.lastElementChild;
                    yelp.textContent = pick(YELPS);
                    yelp.classList.add("on");
                    setTimeout(() => yelp.classList.remove("on"), 900);
                });
                el.addEventListener("pointermove", (e) => {
                    if (!toy.held) return;
                    const now = performance.now();
                    const dt = Math.max(now - toy.lastT, 1) / 1000;
                    toy.vx =
                        toy.vx * 0.6 + ((e.clientX - toy.lastX) / dt) * 0.4;
                    toy.vy =
                        toy.vy * 0.6 + ((e.clientY - toy.lastY) / dt) * 0.4;
                    toy.lastX = e.clientX;
                    toy.lastY = e.clientY;
                    toy.lastT = now;
                    toy.x = e.clientX - toy.grabX;
                    toy.y = e.clientY - toy.grabY;
                });
                const release = () => {
                    if (!toy.held) return;
                    toy.held = false;
                    el.classList.remove("held");
                    // held still before letting go: drop it instead of throwing
                    if (performance.now() - toy.lastT > 120)
                        toy.vx = toy.vy = 0;
                    const speed = Math.hypot(toy.vx, toy.vy);
                    if (speed > 3000) {
                        toy.vx *= 3000 / speed;
                        toy.vy *= 3000 / speed;
                    }
                    dropOnPoster(toy);
                };
                el.addEventListener("pointerup", release);
                el.addEventListener("pointercancel", release);
                el.addEventListener("lostpointercapture", release);
                toy.release = release;
                return toy;
            });
            // safety net so nothing stays stuck to a cursor that is no longer pressing
            const releaseAll = () =>
                [...toys, ...buddyParts].forEach((thing) => thing.release());
            addEventListener("pointerup", releaseAll);
            addEventListener("blur", releaseAll);

            /* ---------- easter egg: put every creature back where it sits on the poster ---------- */

            // each creature's spots on the poster, as fractions of the picture
            const POSTER_SPOTS = {
                ghost: [
                    [0.44, 0.35],
                    [0.83, 0.42],
                    [0.22, 0.45],
                ],
                pumpkin: [[0.145, 0.7]],
                bat: [[0.41, 0.09]],
                cat: [[0.15, 0.29]],
                popcorn: [[0.62, 0.5]],
                beer: [[0.825, 0.225]],
            };
            const POSTER_TILT = (-2.5 * Math.PI) / 180; // matches .poster's rotate()
            const POSTER_BORDER = 8;
            const poster = $(".poster");
            const slots = toys.map((toy) => {
                const taken = toys
                    .slice(0, toys.indexOf(toy))
                    .filter((t) => t.kind === toy.kind).length;
                const [fx, fy] = POSTER_SPOTS[toy.kind][taken];
                return { kind: toy.kind, fx, fy, toy: null, x: 0, y: 0 };
            });
            let posterBox = poster.getBoundingClientRect();

            // where each spot is on screen right now
            function stepSlots() {
                posterBox = poster.getBoundingClientRect();
                const cx = posterBox.left + posterBox.width / 2,
                    cy = posterBox.top + posterBox.height / 2;
                const w = poster.offsetWidth - POSTER_BORDER * 2,
                    h = poster.offsetHeight - POSTER_BORDER * 2;
                const cos = Math.cos(POSTER_TILT),
                    sin = Math.sin(POSTER_TILT);
                for (const s of slots) {
                    const dx = (s.fx - 0.5) * w,
                        dy = (s.fy - 0.5) * h;
                    s.x = cx + dx * cos - dy * sin;
                    s.y = cy + dx * sin + dy * cos;
                }
                // the only hint: a held creature glows once it is right over its own spot
                for (const t of toys)
                    t.el.classList.toggle("warm", t.held && !!freeSlotFor(t));
            }
            function freeSlotFor(toy) {
                const cx = toy.x + toy.w / 2,
                    cy = toy.y + toy.h / 2;
                const reach = Math.max(30, poster.offsetWidth * 0.09);
                return slots.find(
                    (s) =>
                        s.kind === toy.kind &&
                        !s.toy &&
                        Math.hypot(s.x - cx, s.y - cy) < reach,
                );
            }
            function leaveSlot(toy) {
                if (!toy.slot) return;
                toy.slot.toy = null;
                toy.slot = null;
                toy.el.classList.remove("placed");
            }
            function dropOnPoster(toy) {
                stepSlots();
                const cx = toy.x + toy.w / 2,
                    cy = toy.y + toy.h / 2;
                const slot = freeSlotFor(toy);
                if (slot) {
                    slot.toy = toy;
                    toy.slot = slot;
                    toy.vx = toy.vy = 0;
                    toy.el.classList.add("placed");
                    if (slots.every((s) => s.toy)) eggSolved();
                    return;
                }
                const onPoster =
                    cx > posterBox.left &&
                    cx < posterBox.right &&
                    cy > posterBox.top &&
                    cy < posterBox.bottom;
                if (!onPoster) return;
                const yelp = toy.el.lastElementChild;
                yelp.textContent = "Энд биш!";
                yelp.classList.add("on");
                setTimeout(() => yelp.classList.remove("on"), 900);
            }

            const eggModal = $("#egg-modal");
            const eggText = $("#egg-text");
            const eggForm = $("#egg-form");
            function savedName() {
                try {
                    return JSON.parse(localStorage.getItem(STORE_KEY)).name;
                } catch {}
            }
            async function claimEgg(name) {
                eggForm.hidden = true;
                eggText.textContent = "Шалгаж байна...";
                try {
                    const res = await fetch("/api/egg", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name }),
                    });
                    if (!res.ok) throw new Error(res.status);
                    const { winner, place } = await res.json();
                    if (place === 1) {
                        eggText.textContent = `${name}, чи постерын нууцыг хамгийн түрүүнд оллоо! Тусгай шагнал чинийх 🎁`;
                        moneyRain(120);
                    } else if (place > 1) {
                        eggText.textContent = `Чи нууцыг оллоо! Гэхдээ ${winner} чамаас түрүүлчихсэн, чи ${place}-т орлоо.`;
                    } else {
                        eggText.textContent =
                            "Уучлаарай, чи энэ даалгавраас хасагдсан байна.";
                    }
                } catch {
                    eggText.textContent = "Алдаа гарлаа, дахиад оролдоорой.";
                    eggForm.hidden = false;
                }
            }
            function eggSolved() {
                confetti();
                dropIn(eggModal);
                const name = savedName();
                if (name) return claimEgg(name);
                eggText.textContent =
                    "Чи постерын нууцыг оллоо! Нэрээ үлдээгээрэй.";
                eggForm.hidden = false;
                $("#egg-name").focus();
            }
            eggForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = $("#egg-name").value.trim();
                if (name) claimEgg(name);
            });

            /* ---------- the hosts as rag-doll buddies ---------- */

            const buddyScale = innerWidth < 800 ? 0.85 : 1.25;
            const PART_SIZE = {
                head: [84, 84],
                torso: [68, 76],
                hand: [28, 28],
                foot: [36, 25],
            };
            const SVG_NS = "http://www.w3.org/2000/svg";
            const ropeLayer = document.createElementNS(SVG_NS, "svg");
            ropeLayer.id = "ropes";
            layer.append(ropeLayer);
            const buddyParts = [];

            const buddies = BUDDIES.map(({ host, kind }, index) => {
                const art = BUDDY_ART[kind];
                const side = innerWidth * (index % 2 ? 0.5 : 0);
                const cx =
                    side +
                    rand(
                        110 * buddyScale,
                        Math.max(
                            120 * buddyScale,
                            innerWidth / 2 - 110 * buddyScale,
                        ),
                    );
                const cy = rand(
                    170 * buddyScale,
                    Math.max(180 * buddyScale, innerHeight - 190 * buddyScale),
                );
                let yelp;

                // lift < 0 floats up, > 0 sinks: the head is a balloon and the feet are weights, so a buddy hangs upright
                // side pushes a limb outwards so the arms and legs spread instead of hanging limp
                const part = (type, dx, dy, lift, side = 0) => {
                    const el = document.createElement("div");
                    el.className = "buddy-part";
                    const [w, h] = PART_SIZE[type].map((v) => v * buddyScale);
                    el.style.width = w + "px";
                    el.style.height = h + "px";
                    el.innerHTML = art[type](host, `buddy-face-${host}`);
                    layer.append(el);
                    const x = cx + dx * buddyScale,
                        y = cy + dy * buddyScale;
                    const p = {
                        el,
                        type,
                        w,
                        h,
                        r: Math.min(w, h) / 2,
                        x,
                        y,
                        px: x,
                        py: y,
                        tx: x,
                        ty: y,
                        lift,
                        side,
                        flip: type === "foot" && side < 0,
                        held: false,
                    };

                    el.addEventListener("pointerdown", (e) => {
                        e.preventDefault();
                        el.setPointerCapture(e.pointerId);
                        p.held = true;
                        p.grabX = e.clientX - p.x;
                        p.grabY = e.clientY - p.y;
                        p.tx = p.x;
                        p.ty = p.y;
                        el.classList.add("held");
                        yelp.textContent = pick(YELPS);
                        yelp.classList.add("on");
                        setTimeout(() => yelp.classList.remove("on"), 900);
                    });
                    el.addEventListener("pointermove", (e) => {
                        if (!p.held) return;
                        p.tx = e.clientX - p.grabX;
                        p.ty = e.clientY - p.grabY;
                    });
                    p.release = () => {
                        p.held = false;
                        el.classList.remove("held");
                    };
                    for (const type of [
                        "pointerup",
                        "pointercancel",
                        "lostpointercapture",
                    ])
                        el.addEventListener(type, p.release);
                    buddyParts.push(p);
                    return p;
                };

                // created back to front: feet, hands, body, head
                const lf = part("foot", -26, 68, 0.5, -0.35),
                    rf = part("foot", 26, 68, 0.5, 0.35);
                const lh = part("hand", -54, 6, 0, -1),
                    rh = part("hand", 54, 6, 0, 1);
                const torso = part("torso", 0, 0, 0);
                const head = part("head", 0, -66, -1);
                yelp = document.createElement("span");
                yelp.className = "yelp";
                head.el.append(yelp);

                const L = (v) => v * buddyScale;
                const sticks = [
                    [head, torso, L(66)],
                    [torso, lh, L(56)],
                    [torso, rh, L(56)],
                    [torso, lf, L(72)],
                    [torso, rf, L(72)],
                ];
                // minimum distances that stop the limbs folding into each other or over the face
                const gaps = [
                    [lh, rh, L(66)],
                    [lf, rf, L(42)],
                    [head, lh, L(62)],
                    [head, rh, L(62)],
                    [head, lf, L(112)],
                    [head, rf, L(112)],
                    [lh, lf, L(40)],
                    [rh, rf, L(40)],
                ];
                const ropes = sticks
                    .map(([a, b]) =>
                        ["#1a1410", art.rope].map((color, i) => {
                            const line = document.createElementNS(
                                SVG_NS,
                                "line",
                            );
                            line.setAttribute("stroke", color);
                            line.setAttribute(
                                "stroke-width",
                                (i ? 5 : 9) * buddyScale,
                            );
                            line.setAttribute("stroke-linecap", "round");
                            ropeLayer.append(line);
                            return { line, a, b };
                        }),
                    )
                    .flat();
                return {
                    parts: [lf, rf, lh, rh, torso, head],
                    head,
                    torso,
                    sticks,
                    gaps,
                    ropes,
                };
            });

            function pull(a, b, length, stiffness, minOnly) {
                const dx = b.x - a.x,
                    dy = b.y - a.y;
                const dist = Math.hypot(dx, dy) || 0.01;
                if (minOnly && dist >= length) return;
                const wa = a.held ? 0 : 1,
                    wb = b.held ? 0 : 1;
                if (!wa && !wb) return;
                const k = ((dist - length) / dist / (wa + wb)) * stiffness;
                a.x += dx * k * wa;
                a.y += dy * k * wa;
                b.x -= dx * k * wb;
                b.y -= dy * k * wb;
            }

            const deg = (a, b) =>
                (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;

            function stepBuddies(dt, W, H, card, avoidCard) {
                const f = dt * 60;
                for (const b of buddies) {
                    for (const p of b.parts) {
                        if (p.held) {
                            // follows the pointer; the last frame's movement becomes the throw
                            p.px = p.x;
                            p.py = p.y;
                            p.x = p.tx;
                            p.y = p.ty;
                            continue;
                        }
                        let vx = (p.x - p.px) * 0.985,
                            vy = (p.y - p.py) * 0.985;
                        const speed = Math.hypot(vx, vy);
                        if (speed > 60) {
                            vx *= 60 / speed;
                            vy *= 60 / speed;
                        }
                        p.px = p.x;
                        p.py = p.y;
                        p.x += vx + p.side * 0.12 * f * f;
                        p.y += vy + p.lift * 0.22 * f * f;
                    }

                    const t = b.torso;
                    if (!t.held && !reducedMotion) {
                        t.x += rand(-0.1, 0.1) * f;
                        t.y += rand(-0.1, 0.1) * f;
                        if (
                            avoidCard &&
                            t.x > card.left - 40 &&
                            t.x < card.right + 40 &&
                            t.y > card.top - 40 &&
                            t.y < card.bottom + 40
                        ) {
                            t.x +=
                                (t.x < card.left + card.width / 2
                                    ? -0.12
                                    : 0.12) * f;
                        }
                    }

                    for (let i = 0; i < 5; i++) {
                        for (const [a, c, length] of b.sticks)
                            pull(a, c, length, 1, false);
                        for (const [a, c, length] of b.gaps)
                            pull(a, c, length, 0.35, true);
                    }

                    for (const p of b.parts) {
                        if (p.held) continue;
                        const maxX = Math.max(p.r, W - p.r),
                            maxY = Math.max(p.r, H - p.r);
                        if (p.x < p.r) {
                            p.px = p.r + (p.x - p.px) * 0.5;
                            p.x = p.r;
                        }
                        if (p.x > maxX) {
                            p.px = maxX + (p.x - p.px) * 0.5;
                            p.x = maxX;
                        }
                        if (p.y < p.r) {
                            p.py = p.r + (p.y - p.py) * 0.5;
                            p.y = p.r;
                        }
                        if (p.y > maxY) {
                            p.py = maxY + (p.y - p.py) * 0.5;
                            p.y = maxY;
                        }
                    }

                    const upright = deg(t, b.head) + 90;
                    for (const p of b.parts) {
                        const rot =
                            p.type === "hand" || p.type === "foot"
                                ? deg(t, p) - 90
                                : upright;
                        p.el.style.transform = `translate3d(${p.x - p.w / 2}px, ${p.y - p.h / 2}px, 0) rotate(${rot}deg)${p.flip ? " scaleX(-1)" : ""}`;
                    }
                    for (const { line, a, b: end } of b.ropes) {
                        line.setAttribute("x1", a.x);
                        line.setAttribute("y1", a.y);
                        line.setAttribute("x2", end.x);
                        line.setAttribute("y2", end.y);
                    }
                }
            }

            // creatures bounce off each other and off the buddies; held or placed ones do not budge
            const toyRadius = (t) => Math.min(t.w, t.h) * 0.45;
            const toyGive = (t) => (t.held || t.slot ? 0 : t.heavy ? 0.35 : 1);
            function collideToys() {
                for (let i = 0; i < toys.length; i++) {
                    const a = toys[i],
                        ga = toyGive(a),
                        ra = toyRadius(a);
                    for (let j = i + 1; j < toys.length; j++) {
                        const b = toys[j],
                            gb = toyGive(b);
                        if (!ga && !gb) continue;
                        let nx = b.x + b.w / 2 - a.x - a.w / 2,
                            ny = b.y + b.h / 2 - a.y - a.h / 2;
                        const dist = Math.hypot(nx, ny) || 0.01;
                        const overlap = ra + toyRadius(b) - dist;
                        if (overlap <= 0) continue;
                        nx /= dist;
                        ny /= dist;
                        a.x -= (nx * overlap * ga) / (ga + gb);
                        a.y -= (ny * overlap * ga) / (ga + gb);
                        b.x += (nx * overlap * gb) / (ga + gb);
                        b.y += (ny * overlap * gb) / (ga + gb);
                        const closing = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                        if (closing <= 0) continue;
                        const kick = (1.8 * closing) / (ga + gb);
                        a.vx -= kick * ga * nx;
                        a.vy -= kick * ga * ny;
                        b.vx += kick * gb * nx;
                        b.vy += kick * gb * ny;
                    }
                    for (const p of buddyParts) {
                        const gp = p.held ? 0 : 1;
                        if (!ga && !gp) continue;
                        let nx = p.x - a.x - a.w / 2,
                            ny = p.y - a.y - a.h / 2;
                        const dist = Math.hypot(nx, ny) || 0.01;
                        const overlap = ra + p.r - dist;
                        if (overlap <= 0) continue;
                        nx /= dist;
                        ny /= dist;
                        const share = ga ? 1 : 0;
                        a.x -= (nx * overlap * share) / (share + gp);
                        a.y -= (ny * overlap * share) / (share + gp);
                        p.x += (nx * overlap * gp) / (share + gp);
                        p.y += (ny * overlap * gp) / (share + gp);
                        const closing = a.vx * nx + a.vy * ny;
                        if (!ga || closing <= 0) continue;
                        a.vx -= 1.5 * closing * nx;
                        a.vy -= 1.5 * closing * ny;
                    }
                }
            }

            // body parts of different buddies shove each other apart
            function collideBuddies() {
                for (let i = 0; i < buddies.length; i++) {
                    for (let j = i + 1; j < buddies.length; j++) {
                        for (const a of buddies[i].parts) {
                            for (const b of buddies[j].parts) {
                                const overlap =
                                    a.r +
                                    b.r -
                                    Math.hypot(b.x - a.x, b.y - a.y);
                                if (overlap > 0)
                                    pull(a, b, a.r + b.r, 0.8, true);
                            }
                        }
                    }
                }
            }

            let lastFrame = performance.now();
            function frame(now) {
                const dt = Math.min((now - lastFrame) / 1000, 0.05);
                lastFrame = now;
                const W = innerWidth,
                    H = innerHeight;
                const card = rsvpCard.getBoundingClientRect();
                const avoidCard = card.width < W * 0.7;

                collideToys();
                collideBuddies();
                stepSlots();
                for (const t of toys) {
                    if (t.slot) {
                        // sits on its spot and scrolls with the poster
                        t.x = t.slot.x - t.w / 2;
                        t.y = t.slot.y - t.h / 2;
                        t.rot = 0;
                        t.el.style.transform = `translate3d(${t.x}px, ${t.y}px, 0)`;
                        continue;
                    }
                    if (!t.held) {
                        if (t.heavy) {
                            t.vy += 1500 * dt;
                        } else if (!reducedMotion) {
                            t.vx += rand(-120, 120) * dt;
                            t.vy += rand(-120, 120) * dt;
                            // drift off the form so it stays easy to use
                            const cx = t.x + t.w / 2,
                                cy = t.y + t.h / 2;
                            if (
                                avoidCard &&
                                cx > card.left - 30 &&
                                cx < card.right + 30 &&
                                cy > card.top - 30 &&
                                cy < card.bottom + 30
                            ) {
                                t.vx +=
                                    (cx < card.left + card.width / 2 ? -1 : 1) *
                                    320 *
                                    dt;
                            }
                        }
                        const cruise = t.heavy || reducedMotion ? 0 : 45;
                        if (Math.hypot(t.vx, t.vy) > cruise) {
                            const drag = Math.exp(-1.1 * dt);
                            t.vx *= drag;
                            t.vy *= drag;
                        }
                        t.x += t.vx * dt;
                        t.y += t.vy * dt;

                        const maxX = Math.max(0, W - t.w),
                            maxY = Math.max(0, H - t.h);
                        if (t.x < 0) {
                            t.x = 0;
                            t.vx = Math.abs(t.vx) * 0.7;
                        }
                        if (t.x > maxX) {
                            t.x = maxX;
                            t.vx = -Math.abs(t.vx) * 0.7;
                        }
                        if (t.y < 0) {
                            t.y = 0;
                            t.vy = Math.abs(t.vy) * 0.7;
                        }
                        if (t.y > maxY) {
                            t.y = maxY;
                            t.vy = -Math.abs(t.vy) * (t.heavy ? 0.55 : 0.7);
                            if (t.heavy) {
                                t.vx *= Math.exp(-2.5 * dt);
                                if (Math.abs(t.vy) < 70) t.vy = 0;
                            }
                        }
                    }
                    if (t.heavy) {
                        if (!t.held) t.rot += t.vx * dt * 1.3;
                    } else
                        t.rot +=
                            (Math.max(-25, Math.min(25, t.vx * 0.04)) - t.rot) *
                            Math.min(1, dt * 8);
                    t.el.style.transform = `translate3d(${t.x}px, ${t.y}px, 0) rotate(${t.rot}deg)`;
                }
                stepBuddies(dt, W, H, card, avoidCard);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        </script>
    </body>
</html>
